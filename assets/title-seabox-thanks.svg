<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="see you">
  <defs>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="wide"/>
      <feColorMatrix in="wide" type="matrix" values="0 0 0 0 1.000  0 0 0 0 0.604  0 0 0 0 0.180  0 0 0 1.1 0" result="wideC"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="near"/>
      <feColorMatrix in="near" type="matrix" values="0 0 0 0 1.000  0 0 0 0 0.604  0 0 0 0 0.180  0 0 0 1.6 0" result="nearC"/>
      <feMerge><feMergeNode in="wideC"/><feMergeNode in="nearC"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="haze"><stop offset="0" stop-color="#FF9A2E" stop-opacity=".28"/><stop offset="1" stop-color="#FF9A2E" stop-opacity="0"/></radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1520"/><stop offset="1" stop-color="#0E0B12"/></linearGradient>
    <style>
      .tube{fill:none;stroke:#FFF1D6;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;
             stroke-dasharray:1;stroke-dashoffset:1;opacity:.35;
             animation:draw .55s ease-out forwards,power .4s steps(3,end) forwards,flick 8s steps(1) infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes power{0%{opacity:.35}40%{opacity:1}60%{opacity:.5}100%{opacity:1}}
      @keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.4}96.5%{opacity:1}97.5%{opacity:.55}}
      .halo{opacity:0;animation:halo 1.2s ease-out 0.96s forwards}
      @keyframes halo{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.tube{animation:none;stroke-dashoffset:0;opacity:1}.halo{animation:none;opacity:1}}
    </style>
  </defs>
  <rect x="423.1" y="14" width="433.7" height="122" rx="16" fill="url(#plate)" stroke="#2C2433" stroke-width="1.5"/>
  <circle cx="437.1" cy="28" r="3" fill="#3A3240"/><circle cx="437.1" cy="122" r="3" fill="#3A3240"/><circle cx="842.9" cy="28" r="3" fill="#3A3240"/><circle cx="842.9" cy="122" r="3" fill="#3A3240"/>
  <ellipse class="halo" cx="640.0" cy="75.0" rx="201.9" ry="46" fill="url(#haze)"/>
